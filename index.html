<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Library">
<meta name="mobile-web-app-capable" content="yes">
<title>My Library</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f7f7f8;--surface:#fff;--text:#17181a;--muted:#73777d;--border:#e5e6e8;--accent:#111827;--danger:#ef4444}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.home{max-width:1200px;margin:auto;padding:28px 22px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:44px;height:44px;border-radius:13px;background:#111827;color:#fff;display:grid;place-items:center;font-size:21px}
.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}
.upload-btn{background:#111827;color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;display:flex;align-items:center;gap:8px}
.upload-btn:hover{opacity:.9}
.toolbar{display:flex;gap:10px;margin-bottom:30px}
.search{position:relative;flex:1}.search input{width:100%;height:52px;border:1px solid var(--border);background:#fff;border-radius:15px;padding:0 18px 0 48px;outline:0;font-size:15px}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:20px}
.sort-controls{display:flex;gap:8px;flex-shrink:0}
.sort-controls select{height:52px;border:1px solid var(--border);background:#fff;border-radius:15px;padding:0 14px;font-size:14px;color:var(--text)}
.sort-dir-btn{height:52px;width:52px;border:1px solid var(--border);background:#fff;border-radius:15px;font-size:18px;color:var(--text)}
.section{margin-top:30px}.section-title{display:flex;justify-content:space-between;margin-bottom:15px}.section-title h2{margin:0;font-size:17px}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px}
.book-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:12px;transition:.2s;min-width:0}.book-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px #00000012}
.book-cover{height:225px;border-radius:12px;background:linear-gradient(145deg,#ddd,#aaa) center top/cover no-repeat;overflow:hidden;display:grid;place-items:center;font-size:42px;margin-bottom:12px}
.book-title{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book-meta{margin-top:5px;color:var(--muted);font-size:12px}
.card-progress{height:4px;background:#e7e7e7;margin-top:10px;border-radius:10px;overflow:hidden}.card-progress div{height:100%;background:#111827}
.card-actions{display:flex;gap:6px;margin-top:10px}.read-btn{flex:1;background:#111827;color:#fff;border-radius:9px;padding:8px;font-size:12px;font-weight:600}.delete-btn{width:35px;background:#f0f1f3;color:#73777d;border-radius:9px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}.empty-icon{font-size:50px}.empty h3{color:var(--text);margin:15px 0 7px}.empty p{margin:0;font-size:14px}
.continue-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:#111827;color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 10px 25px #00000040;z-index:50}
.continue-fab svg{width:24px;height:24px;fill:#fff;margin-left:3px}
#reader{position:fixed;inset:0;z-index:100;background:#202124;overflow:hidden}.reader-content{position:absolute;inset:0;overflow-y:auto;padding:20px 10px}.pages{width:min(900px,100%);margin:auto;display:flex;flex-direction:column;gap:10px}.pdf-page{display:block;width:100%;height:auto;background:#fff;box-shadow:0 3px 20px #0000004d}
.reader-controls{position:absolute;inset:0;pointer-events:none;transition:opacity .25s}.hidden-controls{opacity:0}
.reader-header{pointer-events:auto;position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 15px 12px;background:linear-gradient(#000c,#0000);color:#fff;display:flex;align-items:center;gap:12px}
.reader-back{width:40px;height:40px;border-radius:50%;background:#ffffff1f;color:#fff;font-size:20px}.reader-title{flex:1;min-width:0}.reader-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.reader-page-number{font-size:12px;opacity:.7}
.reader-bottom{pointer-events:auto;position:absolute;left:0;right:0;bottom:0;padding:15px 15px calc(15px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000c);color:#fff}
.reader-progress{height:4px;background:#ffffff33;overflow:hidden;border-radius:10px;margin-bottom:9px}.reader-progress div{height:100%;background:#fff;width:0}
.reader-status{display:flex;justify-content:space-between;font-size:12px;opacity:.8}
.loading{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#000b;color:#fff;backdrop-filter:blur(5px)}.loading-box{text-align:center}.spinner{width:35px;height:35px;border:3px solid #ffffff40;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.home{padding:20px 15px 40px}.brand h1{font-size:19px}.brand p{display:none}.upload-btn{width:44px;height:44px;padding:0;justify-content:center}.upload-btn .add-text{display:none}.toolbar{gap:8px}.sort-controls select{padding:0 8px;font-size:13px}.books-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book-card{padding:9px}.book-cover{height:210px}.reader-content{padding:0}.pages{gap:2px}.pdf-page{box-shadow:none}}
</style>
</head>
<body>
<main id="home" class="home">
<header class="topbar">
<div class="brand"><div class="brand-icon">📖</div><div><h1>My Library</h1><p>Your personal reading space</p></div></div>
<button id="uploadButton" class="upload-btn" type="button"><span>＋</span><span class="add-text">Add Book</span></button>
<input id="fileInput" type="file" accept="application/pdf,.pdf" hidden>
</header>

<div class="toolbar">
<div class="search"><span class="search-icon">⌕</span><input id="searchInput" type="search" placeholder="Search your books..."></div>
<div class="sort-controls">
<select id="sortSelect"><option value="lastread">Last read</option><option value="added">Date added</option><option value="name">Name</option></select>
<button id="sortDirBtn" class="sort-dir-btn" type="button" title="Toggle sort direction">↓</button>
</div>
</div>

<section class="section"><div class="section-title"><h2>My Books</h2></div><div id="booksGrid" class="books-grid"></div>
<div id="emptyState" class="empty hidden"><div class="empty-icon">📚</div><h3>Your library is empty</h3><p>Upload your first PDF book to start reading.</p></div></section>
</main>

<button id="continueFab" class="continue-fab hidden" type="button" title="Continue reading"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>

<section id="reader" class="hidden">
<div id="readerContent" class="reader-content"><div id="pages" class="pages"></div></div>
<div id="readerControls" class="reader-controls">
<header class="reader-header"><button id="readerBack" class="reader-back">←</button><div class="reader-title"><strong id="readerBookTitle">Book</strong><span id="readerPageNumber" class="reader-page-number">Page 1</span></div></header>
<div class="reader-bottom"><div class="reader-progress"><div id="readerProgressBar"></div></div><div class="reader-status"><span id="readerPageText">Page 1 / 1</span><span id="readerPercentage">0%</span></div></div>
</div>
</section>

<div id="loading" class="loading hidden"><div class="loading-box"><div class="spinner"></div><div id="loadingText">Loading...</div></div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const DB_NAME="MyLibraryDB",DB_VERSION=1,STORE="books";
let db,books=[],currentBook=null,currentPdf=null,pageElements=[],sortKey="lastread",sortDir="desc";

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

const $=id=>document.getElementById(id);
const home=$("home"),fileInput=$("fileInput"),reader=$("reader"),readerContent=$("readerContent"),pages=$("pages");
const controls=$("readerControls"),loading=$("loading");

function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:"id"});s.createIndex("title","title");s.createIndex("lastOpened","lastOpened")}};r.onsuccess=e=>{db=e.target.result;resolve()};r.onerror=()=>reject(r.error)})}
function putBook(book){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).put(book);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function getAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function getOne(id){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function removeBook(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}

function showLoading(t){$("loadingText").textContent=t;loading.classList.remove("hidden")}
function hideLoading(){loading.classList.add("hidden")}
function progress(book){return Math.round(Math.max(0,Math.min(100,book.progress||0)))}
function cleanName(n){return n.replace(/\.pdf$/i,"").replace(/[_-]+/g," ").trim()}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}

function sortBooks(arr){
const dir=sortDir==="asc"?1:-1;
const f=sortKey==="lastread"?"lastOpened":"createdAt";return [...arr].sort((a,b)=>sortKey==="name"?dir*a.title.localeCompare(b.title):dir*((a[f]||0)-(b[f]||0)));
}

function render(){
const q=$("searchInput").value.toLowerCase().trim();
const filtered=sortBooks(books.filter(b=>b.title.toLowerCase().includes(q)));
updateContinueFab();
$("booksGrid").innerHTML="";
if(!filtered.length){$("emptyState").classList.remove("hidden");$("emptyState").querySelector("h3").textContent=q?"No books found":"Your library is empty";$("emptyState").querySelector("p").textContent=q?`No books match "${q}".`:"Upload your first PDF book to start reading.";return}
$("emptyState").classList.add("hidden");
filtered.forEach(book=>{const p=progress(book),card=document.createElement("article");card.className="book-card";card.innerHTML=`<div class="book-cover" data-cover="${book.id}"${book.cover?` style="background-image:url(${book.cover})"`:""}>${book.cover?"":"📖"}</div><div class="book-title" title="${esc(book.title)}">${esc(book.title)}</div><div class="book-meta">${book.totalPages} pages · ${p}%</div><div class="card-progress"><div style="width:${p}%"></div></div><div class="card-actions"><button class="read-btn" data-read="${book.id}">${p>0?"Continue":"Read"}</button><button class="delete-btn" data-delete="${book.id}" title="Delete">×</button></div>`;$("booksGrid").appendChild(card)});
fillMissingCovers()
}

async function makeCover(pdf){
const page=await pdf.getPage(1),base=page.getViewport({scale:1}),view=page.getViewport({scale:420/base.width});
const c=document.createElement("canvas");c.width=Math.floor(view.width);c.height=Math.floor(view.height);
const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
await page.render({canvasContext:ctx,viewport:view}).promise;
return c.toDataURL("image/jpeg",.8)
}
let coverBusy=false;
async function fillMissingCovers(){
if(coverBusy)return;coverBusy=true;
try{for(const b of books.filter(x=>!x.cover&&x.fileData&&x.fileData.length)){
try{const pdf=await pdfjsLib.getDocument({data:b.fileData.slice()}).promise;b.cover=await makeCover(pdf);pdf.destroy&&pdf.destroy();await putBook(b);
const el=document.querySelector(`[data-cover="${b.id}"]`);if(el){el.style.backgroundImage=`url(${b.cover})`;el.textContent=""}}catch(e){console.warn("cover failed",e)}}}
finally{coverBusy=false}
}
function updateContinueFab(){
const fab=$("continueFab");
if(!books.length){fab.classList.add("hidden");fab.dataset.continue="";return}
const b=[...books].sort((a,c)=>(c.lastOpened||0)-(a.lastOpened||0))[0];
fab.classList.remove("hidden");fab.dataset.continue=b.id;
}

$("uploadButton").onclick=()=>fileInput.click();
fileInput.onchange=async e=>{
const file=e.target.files[0];if(!file)return;
if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){alert("Please select a PDF file.");return}
try{
showLoading("Reading PDF...");
const original=new Uint8Array(await file.arrayBuffer());
const pdf=await pdfjsLib.getDocument({data:original.slice()}).promise;
let cover="";try{cover=await makeCover(pdf)}catch(e){console.warn(e)}
const book={cover,id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(),title:cleanName(file.name),fileName:file.name,fileData:original,totalPages:pdf.numPages,currentPage:1,scrollRatio:0,progress:0,createdAt:Date.now(),lastOpened:Date.now()};
await putBook(book);books.push(book);render();await openReader(book.id);
}catch(err){console.error(err);alert("Could not load this PDF.\n\n"+err.message)}finally{hideLoading();fileInput.value=""}
};

$("searchInput").oninput=render;
$("sortSelect").onchange=e=>{sortKey=e.target.value;render()};
$("sortDirBtn").onclick=()=>{sortDir=sortDir==="asc"?"desc":"asc";$("sortDirBtn").textContent=sortDir==="asc"?"↑":"↓";render()};
$("booksGrid").onclick=async e=>{
const read=e.target.closest("[data-read]"),del=e.target.closest("[data-delete]");
if(read){openReader(read.dataset.read);return}
if(del){const b=books.find(x=>x.id===del.dataset.delete);if(b&&confirm(`Delete "${b.title}"?`)){await removeBook(b.id);books=books.filter(x=>x.id!==b.id);render()}}
};
$("continueFab").onclick=()=>{const id=$("continueFab").dataset.continue;if(id)openReader(id)};

let pageObserver;
function setupObserver(){
if(pageObserver)pageObserver.disconnect();
pageObserver=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting&&entry.target.dataset.rendered!=="1")renderPage(entry.target)
})
},{root:readerContent,rootMargin:"1000px 0px 1000px 0px"});
}

async function openReader(id){
const book=await getOne(id);if(!book)return;
const savedRatio=Number(book.scrollRatio||0);restoring=true;currentBook=book;currentBook.lastOpened=Date.now();await putBook(currentBook);
books=books.map(b=>b.id===book.id?book:b);
showLoading("Opening book...");
try{
let data;
if(book.fileData&&book.fileData.length){
data=book.fileData.slice();
}else if(book.file){
const buf=await book.file.arrayBuffer();
if(!buf.byteLength)throw new Error("This book was saved before a storage fix and its file is empty. Please delete it and re-add the PDF.");
book.fileData=new Uint8Array(buf);delete book.file;await putBook(book);
data=book.fileData.slice();
}else{
throw new Error("This book's saved file is missing. Please delete it and re-add the PDF.");
}
currentPdf=await pdfjsLib.getDocument({data}).promise;
home.classList.add("hidden");reader.classList.remove("hidden");document.body.style.overflow="hidden";if(!(history.state&&history.state.reader))history.pushState({reader:1},"");
$("readerBookTitle").textContent=book.title;pages.innerHTML="";pageElements=[];
setupObserver();
const max=pages.clientWidth||Math.min(900,window.innerWidth-20);
for(let n=1;n<=currentPdf.numPages;n++){
$("loadingText").textContent=`Preparing page ${n} of ${currentPdf.numPages}...`;
const page=await currentPdf.getPage(n),base=page.getViewport({scale:1}),scale=max/base.width,view=page.getViewport({scale});
const canvas=document.createElement("canvas");canvas.className="pdf-page";canvas.dataset.page=n;canvas.dataset.rendered="0";
canvas.dataset.scale=scale;canvas.style.width=view.width+"px";canvas.style.height=view.height+"px";
pages.appendChild(canvas);pageElements.push(canvas);
}
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
restorePosition(savedRatio);restoring=false;updateProgress();pageElements.forEach(el=>pageObserver.observe(el));
}catch(err){restoring=false;console.error(err);alert("Could not open this book.\n\n"+err.message);requestClose()}finally{hideLoading()}
}

async function renderPage(canvas){
canvas.dataset.rendered="1";
const n=+canvas.dataset.page,scale=+canvas.dataset.scale;
const page=await currentPdf.getPage(n),view=page.getViewport({scale});
const dpr=Math.min(devicePixelRatio||1,2),ctx=canvas.getContext("2d");
canvas.width=Math.floor(view.width*dpr);canvas.height=Math.floor(view.height*dpr);
await page.render({canvasContext:ctx,viewport:page.getViewport({scale:scale*dpr})}).promise;
pageObserver.unobserve(canvas);
}

function restorePosition(ratio){
const max=Math.max(1,readerContent.scrollHeight-readerContent.clientHeight);
readerContent.scrollTop=max*ratio;
}
function updateProgress(){
if(!currentBook||restoring)return;
const max=Math.max(1,readerContent.scrollHeight-readerContent.clientHeight),top=readerContent.scrollTop,ratio=Math.max(0,Math.min(1,top/max)),pct=Math.round(ratio*100),target=top+readerContent.clientHeight*.25;
let pg=1;for(const el of pageElements){if(el.offsetTop<=target)pg=+el.dataset.page;else break}
currentBook.currentPage=pg;currentBook.scrollRatio=ratio;currentBook.progress=pct;
$("readerProgressBar").style.width=pct+"%";$("readerPercentage").textContent=pct+"%";$("readerPageText").textContent=`Page ${pg} / ${currentBook.totalPages}`;$("readerPageNumber").textContent=`Page ${pg} of ${currentBook.totalPages}`;
}
let saveTimer,restoring=false;
function saveProgress(){if(!currentBook||restoring)return;const book=currentBook;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{await putBook(book);books=books.map(b=>b.id===book.id?book:b)},150)}
readerContent.addEventListener("scroll",()=>{updateProgress();saveProgress()},{passive:true});

let controlsVisible=true;
reader.addEventListener("click",e=>{if(e.target.closest("button"))return;controlsVisible=!controlsVisible;controls.classList.toggle("hidden-controls",!controlsVisible)});
function requestClose(){if(history.state&&history.state.reader)history.back();else closeReader()}
window.addEventListener("popstate",()=>{if(!reader.classList.contains("hidden"))closeReader()});
$("readerBack").onclick=e=>{e.stopPropagation();requestClose()};
function closeReader(){clearTimeout(saveTimer);const book=currentBook;reader.classList.add("hidden");home.classList.remove("hidden");document.body.style.overflow="";if(pageObserver)pageObserver.disconnect();currentPdf=null;currentBook=null;pages.innerHTML="";pageElements=[];if(book){putBook(book);books=books.map(b=>b.id===book.id?book:b)}render()}
document.addEventListener("keydown",e=>{if(reader.classList.contains("hidden"))return;if(e.key==="Escape")requestClose();if(e.key==="ArrowDown")readerContent.scrollBy({top:innerHeight*.8,behavior:"smooth"});if(e.key==="ArrowUp")readerContent.scrollBy({top:-innerHeight*.8,behavior:"smooth"})});
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveProgress()});

(async()=>{try{await openDB();books=await getAll();render()}catch(e){console.error(e);alert("Could not initialize the library.")}})();
</script>
</body>
</html>
